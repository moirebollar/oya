name: oya
description: OYA — Sustainable grocery companion for Netherlands and Spain.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_analytics: ^12.1.2
  firebase_storage: ^13.0.6

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.1.0

  # Barcode scanning
  mobile_scanner: ^7.2.0

  # Open Food Facts
  openfoodfacts: ^3.10.2

  # Maps + Location
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^7.0.0

  # Images + UI
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
